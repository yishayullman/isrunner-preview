<script>const CATS=[{k:'5k',l:'5 ק"מ',a:'5.00',b:'5.24'},{k:'10k',l:'10 ק"מ',a:'10.00',b:'10.24'},{k:'half',l:'חצי מרתון',a:'21.10',b:'21.34'},{k:'mar',l:'מרתון',a:'42.20',b:'42.44'},{k:'long',l:'הארוכה ביותר'}];const S={route:'home',prev:null,cat:'5k',goal:null,privacy:'everyone',globalLb:true,groups:[]};const I={home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/>',leaderboard:'<path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 6h3v1a3 3 0 0 1-3 3M7 6H4v1a3 3 0 0 0 3 3"/>',friends:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.3"/>',groups:'<path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>'};const TABS=[['home','בית'],['leaderboard','שיאים'],['friends','חברים'],['groups','קבוצות'],['me','אני']];const svg=(p,s=20,c='currentColor')=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;const chev=svg('<path d="m15 18-6-6 6-6"/>',18);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2400)}function go(r){S.prev=TABS.some(t=>t[0]===r)?null:S.route;S.route=r;render();window.scrollTo(0,0)}const empty=(icon,txt)=>`<div class="empty"><div class="eic">${svg(icon,18,'#7d828c')}</div>${txt}</div>`;function weeks(){const out=[];const d=new Date();d.setDate(d.getDate()-d.getDay());for(let i=5;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-7*i);out.push(i===0?'השבוע':`${x.getDate()}.${x.getMonth()+1}`)}return out}function home(){const C=2*Math.PI*44;return `<div class="eyebrow">ברוך הבא</div><h1 class="pt">הבית שלך</h1><section class="card notice"><div class="ic">${svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',18,'#c4421f')}</div><h2 class="ct" style="margin-bottom:4px">קליטת ריצות ממקור מדידה</h2><p>הוספת ריצות סגורה כרגע, ריצה נקלטת רק ממקור מדידה מחובר, כרגע אין מקור מחובר</p><button class="btn bi bsm" onclick="go('sources')">מקורות מדידה וחיבור Garmin</button></section><section class="card hero"><div class="ch"><div><h2 class="ct">השבוע שלי</h2><p class="cs">מיום ראשון ועד היום</p></div><button class="btn bo bsm" onclick="setGoal()">${S.goal?'עדכן יעד':'+ יעד שבועי'}</button></div><div class="hero-main"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/><circle cx="50" cy="50" r="44" fill="none" stroke="#e2552f" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="c"><b class="tab">0.0</b><span>${S.goal?`מתוך ${S.goal} ק"מ`:'ק"מ השבוע'}</span></div></div><div class="hstats"><div class="hs"><div class="l">ריצות השבוע</div><div class="v tab">0</div></div><div class="hs"><div class="l">קצב ממוצע</div><div class="v tab">—</div></div></div></div><div class="chart"><div class="chart-t"><span>רצף 6 שבועות (ק"מ)</span><span>${S.goal?`יעד: ${S.goal} ק"מ`:'בלי יעד מוגדר'}</span></div><div class="bars">${weeks().map((w,i)=>`<div class="bar ${i===5?'cur':''}"><div class="tr"><i></i></div><small>${w}</small></div>`).join('')}</div></div></section><section class="card"><div class="ch"><div><h2 class="ct">התראות</h2><p class="cs">כשחבר משתף ריצה חדשה</p></div></div>${empty('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>','אין התראות כרגע')}</section><section class="card"><div class="ch"><div><h2 class="ct">השיאים האישיים שלי</h2><p class="cs">יתמלאו מריצות ממקור מדידה מחובר</p></div></div>${prs()}</section><section class="card"><div class="ch"><div><h2 class="ct">פעילות חברים</h2><p class="cs">14 הימים האחרונים</p></div><button class="btn bo bsm" onclick="go('friends')">חברים</button></div>${empty(I.friends,'עדיין אין חברים. אפשר לחפש רצים לפי שם בלשונית חברים.')}</section>`;}function prs(){return `<div class="prg">${CATS.map(c=>`<div class="pr ${c.k==='long'?'w':''}"><div class="l">${c.l}</div><div class="v tab">—</div><div class="s">אין תוצאה עדיין</div></div>`).join('')}</div>`}function leaderboard(){const c=CATS.find(x=>x.k===S.cat);return `<div class="eyebrow">דירוג שקוף</div><h1 class="pt">שיאים ודירוג</h1><div class="pills">${CATS.map(x=>`<button class="tp ${x.k===S.cat?'on':''}" onclick="S.cat='${x.k}';render()">${x.l}</button>`).join('')}</div><section class="card rule"><h2 class="ct" style="margin-bottom:8px">איך הדירוג עובד</h2><p>ריצה נספרת אם המרחק שנמדד הוא לפחות המרחק הנומינלי ופחות מ־0.25 ק"מ מעליו. הזמן נלקח כפי שנמדד, בלי נרמול. לכל רץ נספרת התוצאה הטובה ביותר.</p>${c.a?`<span class="range">טווח ${c.l}: <b class="tab" dir="ltr">${c.a}–${c.b}</b> ק"מ</span>`:`<span class="range">הריצה עם <b>המרחק הגבוה ביותר</b> שנמדד</span>`}<p class="hint">קצב מתחת ל־2:45 או מעל 15:00 לק"מ מסומן "קצב חריג" לשקיפות בלבד, לא נחסם.</p></section><section class="card"><div class="ch"><div><h2 class="ct">טבלת ${c.l}</h2><p class="cs">רק ריצות משותפות של רצים שבחרו להופיע</p></div><span class="badge">0 רצים</span></div>${empty(I.leaderboard,'עוד אין תוצאות בטבלה. היא תתמלא כשיתחברו מקורות מדידה.')}</section>`;}function friends(){return `<div class="eyebrow">קהילה</div><h1 class="pt">חברים</h1><section class="card"><h2 class="ct" style="margin-bottom:12px">חיפוש רצים לפי שם</h2><form class="row" onsubmit="event.preventDefault();searchF()"><input id="f-q" class="in" placeholder="שם או שם משתמש" /><button class="btn bp" type="submit">חפש</button></form><div id="f-res"></div></section><section class="card"><div class="ch"><h2 class="ct">בקשות ממתינות</h2><span class="badge">0</span></div>${empty('<path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/>','אין בקשות חברות חדשות')}</section><section class="card"><div class="ch"><h2 class="ct">החברים שלי</h2><span class="badge">0</span></div>${empty(I.friends,'עוד אין חברים ברשימה')}</section>`;}function searchF(){const q=document.getElementById('f-q').value.trim();document.getElementById('f-res').innerHTML=q?`<div class="empty" style="margin-top:12px">לא נמצאו רצים בשם "${esc(q)}"</div>`:''}function groups(){return `<div class="eyebrow">רצים יחד</div><h1 class="pt">קבוצות</h1><section class="card"><h2 class="ct">הצטרפות עם קוד</h2><p class="cs" style="margin-bottom:12px">תוצג תצוגה מקדימה לפני ההצטרפות</p><form class="row" onsubmit="event.preventDefault();joinG()"><input id="g-code" class="in" dir="ltr" placeholder="RUN5K2" style="text-transform:uppercase;letter-spacing:.08em;text-align:right" /><button class="btn bi" type="submit">תצוגה מקדימה</button></form></section><section class="card"><div class="ch"><h2 class="ct">הקבוצות שלי</h2><span class="badge">${S.groups.length}</span></div>${S.groups.length?`<div>${S.groups.map(g=>`<div class="src" style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="src-ic" style="background:var(--coral-s)">${svg(I.groups,20,'#c4421f')}</div><div style="flex:1;min-width:0"><b>${esc(g.n)}</b><div class="cs">חבר אחד · קוד <bdi dir="ltr">${g.c}</bdi></div></div><span class="badge teal">מנהל/ת</span></div>`).join('')}</div>`:empty(I.groups,'עוד לא הצטרפת לקבוצה')}</section><section class="card"><h2 class="ct" style="margin-bottom:12px">יצירת קבוצה חדשה</h2><div class="fg"><label class="lbl" for="new-g">שם הקבוצה</label><input id="new-g" class="in" style="width:100%" placeholder="למשל: רצי הבוקר" /></div><button class="btn bp bblk" onclick="createG()">צור קבוצה</button></section>`;}function joinG(){const v=document.getElementById('g-code').value.trim();toast(v?'לא נמצאה קבוצה עם הקוד הזה':'צריך להזין קוד')}function createG(){const n=document.getElementById('new-g').value.trim();if(!n)return toast('צריך שם לקבוצה');const c=Math.random().toString(36).slice(2,8).toUpperCase();S.groups.push({n,c});toast('הקבוצה נוצרה');render()}function me(){const o=(v,t,d)=>`<label class="opt ${S.privacy===v?'on':''}"><input type="radio" name="pv" ${S.privacy===v?'checked':''} onchange="S.privacy='${v}';render();toast('הפרטיות עודכנה')"/><div><b>${t}</b><span>${d}</span></div></label>`;return `<section class="card"><div class="me-top"><div class="av">${svg(I.me,24,'#fff')}</div><div style="min-width:0"><h1 class="ct" style="font-size:1.2rem">החשבון שלי</h1><p class="cs">כאן יופיעו השם והפרטים שלך</p></div></div></section><section class="card"><h2 class="ct" style="margin-bottom:12px">השיאים האישיים שלי</h2>${prs()}</section><section class="card"><h2 class="ct">פרטיות</h2><p class="cs" style="margin-bottom:12px">נאכף בשרת. תמיד אפשר להפוך ריצה בודדת לפרטית.</p>${o('everyone','כולם','כל משתמש רשום יכול לראות ריצות משותפות')}${o('friends','רק חברים','רק חברים מאושרים')}${o('none','אף אחד','הפרופיל והריצות מוסתרים')}<label class="chk"><input type="checkbox" ${S.globalLb?'checked':''} onchange="S.globalLb=this.checked;toast('נשמר')"/>להופיע בדירוג הכללי</label></section><section class="card list" style="padding-top:6px;padding-bottom:6px"><button onclick="go('sources')"><span>מקורות מדידה</span>${chev}</button><button onclick="go('resources')"><span>משאבים לרצים</span>${chev}</button><button onclick="toast('טיוטת מדיניות פרטיות, גיל 18+')"><span>מדיניות פרטיות</span>${chev}</button></section>`;}function sources(){return `<h1 class="pt">מקורות מדידה</h1><section class="card"><div class="src" style="margin-bottom:14px"><div class="src-ic">${svg('<circle cx="12" cy="12" r="7"/><path d="M12 9v3l2 1"/><path d="M9 2h6M9 22h6"/>',22,'#1d5c63')}</div><div style="flex:1;min-width:0"><h2 class="ct">Garmin Connect</h2><p class="cs">חיבור רשמי דרך Garmin</p></div><span class="badge amb">לא מחובר</span></div><ol class="steps"><li>Isrunner מגישה בקשה לתוכנית המפתחים של Garmin</li><li>אחרי אישור, תתחבר דרך מסך ההתחברות של Garmin</li><li>ריצות חדשות ייקלטו אוטומטית, בלי הקלדה ידנית</li></ol><button class="btn bo bblk" style="margin-top:12px" onclick="toast('החיבור ייפתח אחרי אישור Garmin')">חבר את Garmin</button></section><section class="card rule"><p style="margin:0">כל עוד אין מקור מחובר, שום ריצה לא תסומן "מאומתת".</p></section>`;}function resources(){const r=(k,t,d)=>`<div class="res"><div class="k">${k}</div><div><b>${t}</b><span>${d}</span></div></div>`;return `<h1 class="pt">משאבים לרצים</h1><section class="card">${r('01','חימום לפני ריצה','5–8 דקות הליכה מהירה ותרגילי תנועה')}${r('02','שחרור אחרי ריצה','הליכה רגועה ומתיחות קלות')}${r('03','פודקאסטים','האזנה לריצות ארוכות')}${r('04','סרטוני טכניקה','יציבה, קדנס ונשימה')}</section>`;}function render(){const V={home,leaderboard,friends,groups,me,sources,resources};document.getElementById('main').innerHTML=V[S.route]();document.getElementById('main').style.animation='none';void document.getElementById('main').offsetWidth;document.getElementById('main').style.animation='';document.getElementById('back-btn').classList.toggle('hidden',!S.prev);const active=TABS.some(t=>t[0]===S.route)?S.route:(S.prev||'me');document.getElementById('bottom-nav').innerHTML=TABS.map(([k,l])=>`<button class="nb ${k===active?'on':''}" data-tab="${k}" onclick="go('${k}')">${svg(I[k],21)}<span>${l}</span></button>`).join('');}function setGoal(){const v=prompt('יעד שבועי בק"מ (ריק = בלי יעד)',S.goal||'');if(v===null)return;const n=parseFloat(v);S.goal=n>0?Math.round(n*10)/10:null;render();toast(S.goal?'היעד נשמר':'היעד הוסר')}document.getElementById('back-btn').onclick=()=>go(S.prev||'home');document.getElementById('brand-btn').onclick=()=>go('home');render();</script></body></html>
