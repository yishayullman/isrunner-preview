<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f1ec" />
<meta name="description" content="Isrunner — קהילת הרצים של ישראל: שעון GPS חי, מחשבון קצב, שיאים אישיים, Garmin ו-Strava." />
<meta property="og:title" content="Isrunner — קהילת הרצים של ישראל" />
<meta property="og:description" content="שעון GPS חי מהטלפון, מחשבון קצב ומירוץ, שיאים אישיים וחיבורי Garmin ו-Strava." />
<meta property="og:type" content="website" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='44' fill='%230d1016'/%3E%3Cg fill='none' stroke-linecap='round' stroke-width='20'%3E%3Cpath d='M44 134L84 62' stroke='%23fff'/%3E%3Cpath d='M86 134L126 62' stroke='%23ff4d1c'/%3E%3Cpath d='M128 134L148 98' stroke='%23fff' opacity='.45'/%3E%3C/g%3E%3C/svg%3E" />
<title>Isrunner — קהילת הרצים של ישראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas:#f4f1ec; --s:#fff; --s2:#f8f6f2; --s3:#efebe4;
    --obs:#0d1016; --obs2:#161b25; --ink:#11141b; --ink2:#242934; --soft:#4e5563; --mute:#767d8a;
    --line:rgba(17,20,27,.075); --line2:rgba(17,20,27,.14);
    --coral:#ff4d1c; --coral-d:#df3a0e; --cgrad:linear-gradient(135deg,#ff5d2e,#e63c10);
    --coral-s:#fff0eb; --coral-l:#f8c6b6;
    --teal:#0b7a62; --teal-b:#22c997; --teal-s:#e6f6f1; --teal-l:#b2e2d4;
    --amb-bg:#fdf7e9; --amb-b:#eed297; --amb-t:#744d0a;
    --red-bg:#fdeeec; --red-b:#f3c0b8; --red-t:#a52a16;
    --disp:'Rubik','Heebo',-apple-system,BlinkMacSystemFont,sans-serif;
    --body:'Heebo','Rubik',-apple-system,BlinkMacSystemFont,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
    --sh:0 1px 2px rgba(13,16,22,.04),0 10px 28px -14px rgba(13,16,22,.13);
    --sh2:0 4px 12px rgba(13,16,22,.08),0 24px 48px -18px rgba(13,16,22,.46);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--body);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
    background:radial-gradient(840px 340px at 95% -8%,rgba(255,77,28,.09),transparent 62%),radial-gradient(640px 300px at -8% 2%,rgba(11,122,98,.07),transparent 60%),var(--canvas)}
  button,input,textarea{font-family:inherit;font-size:1rem;color:inherit}
  .hidden{display:none!important}
  .tab{font-variant-numeric:tabular-nums}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  header{position:sticky;top:0;z-index:20;background:rgba(244,241,236,.84);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;min-height:58px}
  .brand{display:inline-flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:1.22rem;letter-spacing:-.03em;color:var(--ink)}
  .mark{width:35px;height:35px;border-radius:12px;background:linear-gradient(145deg,#1b202b,#0d1016);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(13,16,22,.55),inset 0 1px 0 rgba(255,255,255,.15)}
  .back{background:var(--s);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
  .run-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:#fff;background:var(--cgrad);border:0;padding:6px 13px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 8px 18px -8px rgba(255,77,28,.8),inset 0 1px 0 rgba(255,255,255,.25)}
  .run-pill:active{transform:scale(.96)}
  main{padding:16px 14px 8px;animation:in .3s var(--ease)}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:.78rem;font-weight:700;color:var(--coral-d);margin:0 2px 2px}
  h1.pt{margin:0 2px 16px;font-family:var(--disp);font-size:1.78rem;font-weight:700;letter-spacing:-.035em;line-height:1.12}
  .card{background:var(--s);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:19px 17px;margin-bottom:14px}
  .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .ct{margin:0;font-family:var(--disp);font-size:1.06rem;font-weight:700;letter-spacing:-.015em}
  .cs{margin:3px 0 0;font-size:.83rem;color:var(--mute)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .18s var(--ease);text-align:center;line-height:1.3;max-width:100%}
  .btn:active{transform:scale(.97)}
  .bp{background:var(--cgrad);color:#fff;box-shadow:0 10px 22px -10px rgba(255,77,28,.85),inset 0 1px 0 rgba(255,255,255,.25)}
  .bi{background:var(--obs);color:#fff}
  .bo{background:var(--s);color:var(--ink);border-color:var(--line2)}
  .bd{background:var(--red-bg);color:var(--red-t);border-color:var(--red-b)}
  .bsm{min-height:35px;padding:6px 13px;font-size:.81rem}
  .bblk{width:100%}
  .brow{display:flex;flex-wrap:wrap;gap:8px}
  /* Flagship Obsidian Hero */
  .hero{position:relative;overflow:hidden;color:#fff;border:1px solid rgba(255,255,255,.08);box-shadow:var(--sh2);
    background:radial-gradient(400px 240px at 0% 100%,rgba(255,77,28,.26),transparent 68%),radial-gradient(320px 200px at 100% 0%,rgba(34,201,151,.14),transparent 64%),linear-gradient(155deg,#161b25 0%,#0d1016 60%,#121620 100%)}
  .hero::before{content:'';position:absolute;top:-70px;left:-85px;width:270px;height:145px;border:1.5px solid rgba(255,255,255,.055);border-radius:999px;box-shadow:0 0 0 18px rgba(255,255,255,.02),0 0 0 36px rgba(255,255,255,.014);pointer-events:none}
  .hero>*{position:relative;z-index:1}
  .hero .cs{color:rgba(255,255,255,.6)}
  .hero .bo{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
  .hero-main{display:flex;align-items:center;gap:16px}
  .ring{flex-shrink:0;width:106px;height:106px;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .c b{font-family:var(--disp);font-size:1.6rem;font-weight:700;line-height:1;letter-spacing:-.025em}
  .ring .c span{font-size:.69rem;color:rgba(255,255,255,.6);margin-top:3px}
  .hstats{display:grid;gap:10px;flex:1;min-width:0}
  .hs{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:9px 12px}
  .hs .l{font-size:.71rem;color:rgba(255,255,255,.6)}
  .hs .v{font-family:var(--disp);font-size:1.18rem;font-weight:700;letter-spacing:-.015em;line-height:1.25}
  .chart{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
  .chart-t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:10px}
  .bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
  .bar{display:flex;flex-direction:column;align-items:center;gap:5px}
  .bar .tr{width:100%;max-width:34px;height:56px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:flex-end;overflow:hidden}
  .bar .tr i{display:block;width:100%;border-radius:10px;background:rgba(255,255,255,.28)}
  .bar.cur .tr i{background:var(--cgrad)}
  .bar small{font-size:.67rem;color:rgba(255,255,255,.55)}
  .bar.cur small{color:#fff;font-weight:700}
  .hero-cta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
  /* Quick tools strip */
  .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .qtile{display:flex;align-items:center;gap:10px;padding:13px 13px;border-radius:20px;background:var(--s);border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;text-align:right;transition:transform .16s var(--ease)}
  .qtile:active{transform:scale(.98)}
  .qic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .qtile b{display:block;font-family:var(--disp);font-size:.89rem;font-weight:700}
  .qtile span{display:block;font-size:.73rem;color:var(--mute)}
  /* Trust strip */
  .trust{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:20px;background:var(--s);border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:14px}
  .trust-ic{width:32px;height:32px;border-radius:10px;background:var(--teal-s);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
  .trust b{display:block;font-family:var(--disp);font-size:.9rem}
  .trust p{margin:2px 0 0;font-size:.8rem;color:var(--soft)}
  /* GPS Cockpit & Pacer */
  .gps-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .gp{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:.75rem;font-weight:700;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14)}
  .gp i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .gp.ok i{background:#22c997;box-shadow:0 0 0 3px rgba(34,201,151,.28)}
  .gp.warn i{background:#f5b942}
  .gp.bad i{background:#f25f5c}
  .bigd{text-align:center;padding:16px 0 10px}
  .bigd b{display:block;font-family:var(--disp);font-size:4.2rem;font-weight:700;line-height:.92;letter-spacing:-.045em}
  .bigd span{display:inline-block;margin-top:6px;font-size:.86rem;color:rgba(255,255,255,.6)}
  .tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tgrid .hs{text-align:center;padding:10px 6px}
  .pacer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:.78rem}
  .ppills{display:flex;flex-wrap:wrap;gap:4px}
  .pc{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:rgba(255,255,255,.78);border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:700;cursor:pointer}
  .pc.on{background:var(--coral);border-color:var(--coral);color:#fff}
  .pbar{width:100%;height:7px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
  .pbar i{display:block;height:100%;border-radius:999px;background:var(--cgrad);transition:width .3s}
  .rbox{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);overflow:hidden;margin-top:12px}
  .rbox.lt{background:var(--s2);border-color:var(--line)}
  .rempty{text-align:center;padding:18px 10px;font-size:.78rem;color:rgba(255,255,255,.45);border:1px dashed rgba(255,255,255,.15);border-radius:16px;margin-top:12px}
  .srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:.82rem;margin-bottom:6px}
  .sbar{height:8px;border-radius:999px;background:var(--s3);overflow:hidden}
  .sbar i{display:block;height:100%;border-radius:999px;background:var(--cgrad)}
  .errbox{background:var(--red-bg);border:1px solid var(--red-b);color:var(--red-t);border-radius:12px;padding:9px 12px;font-size:.84rem;margin-top:10px}
  /* Medal PR Trophy Wall */
  .prg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pr{background:linear-gradient(180deg,#fff,#f8f6f2);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
  .pr.u{border-color:rgba(255,77,28,.25);background:linear-gradient(180deg,#fff,#fff6f2)}
  .pr.w{grid-column:span 2}
  .pr-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px}
  .pr-chip{direction:ltr;unicode-bidi:isolate;font-family:var(--disp);font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--s3);color:var(--soft)}
  .pr.u .pr-chip{background:var(--obs);color:#fff}
  .pr .l{font-size:.75rem;font-weight:700;color:var(--soft)}
  .pr .v{font-family:var(--disp);font-size:1.35rem;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .pr .v.dim{color:#c5c0b8}
  .pr .s{font-size:.71rem;color:var(--mute)}
  /* Pace Calc */
  .slider{width:100%;accent-color:var(--coral);cursor:pointer;margin-top:12px}
  .rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .rtile{background:var(--s2);border:1px solid var(--line);border-radius:15px;padding:11px 12px}
  .rtile .l{font-size:.74rem;color:var(--mute);font-weight:600}
  .rtile .v{font-family:var(--disp);font-size:1.25rem;font-weight:700;margin-top:2px}
  .zrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:13px;background:var(--s2);border:1px solid var(--line);font-size:.84rem;margin-bottom:7px}
  /* Generic */
  .empty{text-align:center;padding:20px 14px;color:var(--mute);font-size:.88rem;background:var(--s2);border:1px dashed var(--line2);border-radius:16px}
  .empty .eic{width:40px;height:40px;margin:0 auto 8px;border-radius:12px;background:var(--s);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tp{padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--s);color:var(--soft);font-weight:700;font-size:.83rem;cursor:pointer}
  .tp.on{background:var(--obs);color:#fff;border-color:var(--obs)}
  .rule{background:var(--s2);box-shadow:none}
  .rule p{margin:0 0 8px;font-size:.86rem;color:var(--soft)}
  .range{display:inline-flex;align-items:center;gap:8px;background:var(--s);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.83rem;font-weight:600}
  .range b{font-family:var(--disp);color:var(--coral-d)}
  .hint{font-size:.77rem;color:var(--mute);margin:8px 0 0}
  .row{display:flex;gap:8px}
  .in{flex:1;min-width:0;min-height:44px;padding:10px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--s2);font-size:1rem}
  .in:focus{outline:none;background:#fff;border-color:var(--obs);box-shadow:0 0 0 4px rgba(13,16,22,.08)}
  .lbl{display:block;font-size:.84rem;font-weight:700;color:var(--ink2);margin-bottom:6px}
  .fg{margin-bottom:12px}
  .opt{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--s2);cursor:pointer;margin-bottom:8px}
  .opt.on{border-color:var(--obs);background:#fff;box-shadow:0 0 0 3px rgba(13,16,22,.06)}
  .opt input{margin-top:4px;accent-color:var(--coral)}
  .opt b{display:block;font-size:.92rem;font-weight:700}
  .opt span{font-size:.8rem;color:var(--mute)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer;margin-top:6px}
  .chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--coral);flex-shrink:0}
  .me-top{display:flex;align-items:center;gap:14px}
  .av{width:52px;height:52px;border-radius:50%;background:var(--cgrad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line);flex-shrink:0}
  .list button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 2px;background:none;border:0;border-bottom:1px solid var(--line);font-size:.94rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:right}
  .list button:last-child{border-bottom:0}
  .src{display:flex;align-items:center;gap:12px}
  .src-ic{width:44px;height:44px;border-radius:14px;background:var(--teal-s);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--line2);background:var(--s3);color:var(--soft);white-space:nowrap}
  .badge.amb{background:var(--amb-bg);border-color:var(--amb-b);color:var(--amb-t)}
  .badge.teal{background:var(--teal-s);border-color:var(--teal-l);color:var(--teal)}
  .run-card{border:1px solid var(--line);border-radius:18px;background:var(--s2);padding:13px 14px;margin-bottom:9px}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;display:flex;gap:10px;font-size:.85rem;color:var(--soft);padding:5px 0}
  .steps li span{min-width:0;flex:1;overflow-wrap:anywhere}
  .steps li::before{content:counter(s);flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--obs);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  code{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;background:var(--s3);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
  .res{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:0}
  .res .k{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:var(--coral-s);color:var(--coral-d);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:.85rem}
  .res b{display:block;font-size:.92rem}
  .res span{font-size:.82rem;color:var(--mute)}
  nav.bn{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;max-width:500px;margin:0 auto;z-index:30;background:rgba(13,16,22,.94);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-radius:26px;box-shadow:0 20px 44px -12px rgba(13,16,22,.62),inset 0 1px 0 rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;gap:2px}
  .nb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;background:transparent;color:rgba(255,255,255,.56);font-size:.7rem;font-weight:600;cursor:pointer;border-radius:20px;transition:all .2s var(--ease)}
  .nb svg{width:21px;height:21px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nb.on{color:#fff;background:rgba(255,255,255,.11)}
  .nb.on svg{color:var(--coral)}
  .nb.on::after{content:'';position:absolute;bottom:4px;width:14px;height:2.5px;border-radius:999px;background:var(--coral)}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(13,16,22,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px}
  .mcard{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:#fff;border-radius:26px;padding:18px;box-shadow:var(--sh2)}

  if(G.pts.length<3||km<.05||sec<10)return toast('הריצה קצרה מדי (נדרשים לפחות 50 מ׳ ו-10 שניות של GPS)');

  S.runs.unshift({id:'gps_'+Date.now(),km,sec,ranAt:new Date().toISOString(),note,splits:G.splits.slice(),route:G.route.slice(0,120),source:'מדידת GPS ב-Isrunner'});
  saveRuns(S.runs);resetTrack();toast('הריצה נשמרה במכשיר!');go('home');
}
function gpsBadge(){
  if(G.status==='unsupported')return '<span class="gp bad"><i></i>GPS לא נתמך</span>';
  if(G.status==='denied')return '<span class="gp bad"><i></i>אין הרשאת מיקום</span>';
  if(G.status==='ready')return '<span class="gp ok"><i></i>GPS מוכן</span>';
  if(G.status==='good')return `<span class="gp ok"><i></i>${G.acc<=15?'GPS מדויק':'GPS טוב'} (±${G.acc}מ׳)</span>`;
  if(G.status==='weak')return `<span class="gp warn"><i></i>GPS חלש (±${G.acc||'?'}מ׳)</span>`;
  return '<span class="gp warn"><i></i>מאתר GPS...</span>';
}
function updLive(){
  const km=G.distM/1000,sec=netSec(),ap=(km>=.03&&sec>0)?Math.round(sec/km):null,kmM=Math.round(G.distM%1000);
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  s('ld',km.toFixed(2));s('lt',fmtDur(sec));s('lap',ap?fmtPace(ap):'—');s('lcp',G.curPace?fmtPace(G.curPace):'—');
  s('lkt',`${kmM} / 1,000 מ׳ לק"מ הבא`);

  const ge=document.getElementById('gp-err');if(ge){ge.textContent=G.err;ge.classList.toggle('hidden',!G.err)}
  const pd=document.getElementById('pd');
  if(pd&&G.targetPace&&km>=.05){const diff=Math.round(km*G.targetPace)-sec;pd.style.color=diff>=0?'#5eead4':'#fca5a5';pd.textContent=diff>=0?`מקדים ב-${diff} שנ׳`:`מאחר ב-${Math.abs(diff)} שנ׳`}
}

function weeksData(){
  const out=[],now=new Date(),sun=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());
  for(let i=5;i>=0;i--){
    const a=new Date(sun);a.setDate(sun.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+7);
    let km=0,cnt=0;S.runs.forEach(r=>{const t=Date.parse(r.ranAt);if(t>=a.getTime()&&t<b.getTime()){km+=r.km;cnt++}});
    out.push({lbl:i===0?'השבוע':`${a.getDate()}.${a.getMonth()+1}`,km,cnt,cur:i===0});
  }
  return out;
}
function bestFor(c){
  let best=null;
  S.runs.forEach(r=>{
    if(c.k==='long'){if(!best||r.km>best.km)best=r}
    else if(r.km>=c.min&&r.km<c.max){if(!best||r.sec<best.sec)best=r}
  });
  return best;
}
function prs(){
  return `<div class="prg">${CATS.map(c=>{const b=bestFor(c);const val=!b?'—':c.k==='long'?`${b.km.toFixed(2)} ק"מ`:fmtDur(b.sec);return `<div class="pr ${c.k==='long'?'w':''} ${b?'u':''}"><div class="pr-top"><div class="l">${c.l}</div><span class="pr-chip">${c.c}</span></div><div class="v tab ${b?'':'dim'}">${val}</div><div class="s">${b?`${b.km.toFixed(2)} ק"מ · ${fmtPace(b.sec/b.km)} דק'/ק"מ`:(c.a?`טווח ${c.a}–${c.b} ק"מ`:'המרחק הגבוה ביותר')}</div></div>`}).join('')}</div>`;
}

async function submitAuth(){
  const emailRaw=(document.getElementById('a-email')?.value||'').trim().toLowerCase();
  const pw=document.getElementById('a-pw')?.value||'';
  const accounts=loadAccounts();
  if(!emailRaw||!EMAIL_RE.test(emailRaw)||emailRaw.length>120){S.authErr='חובה להזין כתובת אימייל תקינה.';render();return}
  if(pw.length<8){S.authErr='הסיסמה חייבת להכיל לפחות 8 תווים.';render();return}
  const canon=canonEmail(emailRaw);

  if(S.authMode==='register'){
    const name=(document.getElementById('a-name')?.value||'').trim();
    if(name.length<2||name.length>40){S.authErr='שם התצוגה חייב להכיל 2 עד 40 תווים.';render();return}
    if(isDispEmail(emailRaw)){S.authErr='לא ניתן להירשם עם כתובת אימייל זמנית או חד-פעמית. השתמש באימייל אישי קבוע.';render();return}
    if(accounts.some(a=>a.canon===canon||a.email===emailRaw)){S.authErr='כתובת האימייל הזו (או כינוי שלה) כבר משויכת לחשבון קיים. עבור ל"התחברות".';render();return}
    const id='u_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const pwHash=await hashPw(pw,id);
    const acc={id,name,email:emailRaw,canon,pwHash,createdAt:new Date().toISOString()};
    accounts.push(acc);saveAccounts(accounts);
    try{localStorage.setItem(LS_SES,id)}catch{}
    S.user=acc;S.authErr='';S.runs=loadRuns(id);S.route='home';S.prev=null;
    toast(`ברוך הבא, ${name}!`);render();window.scrollTo(0,0);
  }else{
    const acc=accounts.find(a=>a.canon===canon||a.email===emailRaw);
    if(!acc){S.authErr='אימייל או סיסמה שגויים (או שעדיין לא נרשמת במכשיר הזה).';render();return}
    const pwHash=await hashPw(pw,acc.id);
    if(pwHash!==acc.pwHash){S.authErr='אימייל או סיסמה שגויים.';render();return}
    try{localStorage.setItem(LS_SES,acc.id)}catch{}
    S.user=acc;S.authErr='';S.runs=loadRuns(acc.id);S.route='home';S.prev=null;
    toast(`שלום ${acc.name}!`);render();window.scrollTo(0,0);
  }
}

function calcBody(p){
  const races=[['5 ק"מ',5],['10 ק"מ',10],['חצי מרתון',21.0975],['מרתון',42.195]];
  const zones=[['ריצה קלה / התאוששות',`${fmtPace(p+45)}–${fmtPace(p+75)}`],['קצב מרתון',fmtPace(p+15)],['טמפו / סף',fmtPace(Math.max(170,p-10))],['אינטרוולים (1,000 מ׳)',fmtPace(Math.max(160,p-25))]];
  return {
    racesHtml: races.map(([l,km])=>`<div class="rtile"><div class="l">${l}</div><div class="v tab">${fmtDur(Math.round(km*p))}</div></div>`).join(''),
    zonesHtml: zones.map(([n,v])=>`<div class="zrow"><b>${n}</b><span class="tab" style="color:var(--coral-d);font-weight:700">${v} דק'/ק"מ</span></div>`).join('')
  };
}
function updCalc(v){

    </div>
    <div class="pacer">
      <span style="color:rgba(255,255,255,.72)">${G.targetPace?`יעד <b class="tab" style="color:#fff">${fmtPace(G.targetPace)}</b> · <b id="pd" style="color:#5eead4">מוכן</b>`:'קצב יעד (Pacer):'}</span>
      <div class="ppills">${[[null,'ללא'],[270,'4:30'],[300,'5:00'],[330,'5:30'],[360,'6:00'],[390,'6:30']].map(([v,l])=>`<button class="pc ${G.targetPace===v?'on':''}" onclick="G.targetPace=${v};render()">${l}</button>`).join('')}</div>
    </div>
    <div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;font-size:.73rem;color:rgba(255,255,255,.6)"><span id="lkt" class="tab">${kmM} / 1,000 מ׳ לק"מ הבא</span><span>${G.phase==='running'?'מקליט GPS':G.phase==='paused'?'מושהה':'מוכן ליציאה'}</span></div>
      <div class="pbar"><i id="lkb" style="width:${Math.min(100,Math.round(kmM/10))}%"></i></div>
    </div>
    <div id="rt-slot">${routeSvg(G.route,true)}</div>
    <div class="brow" style="margin-top:14px">
      ${G.phase==='idle'?'<button class="btn bp bblk" style="min-height:50px;font-size:1.05rem" onclick="startTrack()">▶ התחל ריצה</button>':G.phase==='running'?'<button class="btn bo" style="flex:1;min-height:46px" onclick="pauseTrack()">⏸ השהה</button><button class="btn bp" style="flex:1;min-height:46px" onclick="finishTrack()">■ סיים ריצה</button>':'<button class="btn bp" style="flex:1;min-height:46px" onclick="resumeTrack()">▶ המשך</button><button class="btn bo" style="flex:1;min-height:46px" onclick="finishTrack()">✓ סיים</button><button class="btn bd" style="min-height:46px" onclick="resetTrack()">בטל</button>'}
    </div>
  </section>
  <section class="card"><h2 class="ct" style="margin-bottom:10px">פיצולי ק"מ (Splits)</h2><div id="sp-slot">${splitsHtml(G.splits)}</div></section>
  <section class="card rule"><p style="margin:0">למדידה מדויקת באייפון מומלץ לצאת החוצה ולהשאיר את המסך פתוח (אנחנו מפעילים שמירת מסך אוטומטית). לריצה עם מסך כבוי בכיס מומלץ שעון Garmin / Strava.</p></section>`;
}

function leaderboard(){
  const c=CATS.find(x=>x.k===S.cat);
  return `
  <div class="eyebrow">דירוג שקוף</div>
  <h1 class="pt">שיאים ודירוג</h1>
  <div class="pills">${CATS.map(x=>`<button class="tp ${x.k===S.cat?'on':''}" onclick="S.cat='${x.k}';render()">${x.l}</button>`).join('')}</div>
  <section class="card hero" style="text-align:center;padding:24px 18px">
    <div style="display:inline-flex;width:48px;height:48px;border-radius:16px;background:rgba(255,77,28,.2);color:#ff8a66;align-items:center;justify-content:center;margin-bottom:10px">${svg(I.leaderboard,24,'#ff8a66')}</div>
    <h2 class="ct" style="justify-content:center;font-size:1.18rem;margin-bottom:4px">מקום #1 ב־${c.l} עדיין פנוי</h2>
    <p class="cs" style="margin-bottom:14px">הטבלה מתמלאת רק מריצות GPS, Garmin או Strava — בלי הזנה ידנית ובלי אנשים לדוגמה.</p>
    <button class="btn bp bsm" onclick="go('track')">▶ רוץ עכשיו ותפוס פסגה</button>
  </section>
  <section class="card rule">
    <h2 class="ct" style="margin-bottom:8px">איך הדירוג עובד</h2>
    <p>ריצה נספרת אם המרחק שנמדד הוא לפחות המרחק הנומינלי ופחות מ־0.25 ק"מ מעליו. הזמן נלקח כפי שנמדד, בלי נרמול. לכל רץ נספרת התוצאה הטובה ביותר.</p>
    ${c.a?`<span class="range">טווח ${c.l}: <b class="tab" dir="ltr">${c.a}–${c.b}</b> ק"מ</span>`:`<span class="range">הריצה עם <b>המרחק הגבוה ביותר</b> שנמדד</span>`}
    <p class="hint">קצב מתחת ל־2:45 או מעל 15:00 לק"מ מסומן "קצב חריג" לשקיפות בלבד, לא נחסם.</p>
  </section>`;
}

function friends(){
  return `
  <div class="eyebrow">קהילה</div>
  <h1 class="pt">חברים</h1>
  <section class="card">
    <h2 class="ct" style="margin-bottom:12px">חיפוש רצים לפי שם</h2>
    <form class="row" onsubmit="event.preventDefault();searchF()"><input id="f-q" class="in" placeholder="שם או שם משתמש" /><button class="btn bp" type="submit">חפש</button></form>
    <div id="f-res"></div>
  </section>
  <section class="card"><div class="ch"><h2 class="ct">בקשות ממתינות</h2><span class="badge">0</span></div>${empty('<path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/>','אין בקשות חברות חדשות')}</section>
  <section class="card"><div class="ch"><h2 class="ct">החברים שלי</h2><span class="badge">0</span></div>${empty(I.friends,'עוד אין חברים ברשימה')}</section>`;
}
function searchF(){const q=document.getElementById('f-q').value.trim();document.getElementById('f-res').innerHTML=q?`<div class="empty" style="margin-top:12px">לא נמצאו רצים בשם "${esc(q)}"</div>`:''}

function groups(){
  return `
  <div class="eyebrow">רצים יחד</div>
  <h1 class="pt">קבוצות</h1>
  <section class="card">
    <h2 class="ct">הצטרפות עם קוד</h2><p class="cs" style="margin-bottom:12px">תוצג תצוגה מקדימה לפני ההצטרפות</p>
    <form class="row" onsubmit="event.preventDefault();joinG()"><input id="g-code" class="in" dir="ltr" placeholder="RUN5K2" style="text-transform:uppercase;letter-spacing:.08em;text-align:right" /><button class="btn bi" type="submit">תצוגה מקדימה</button></form>
  </section>
  <section class="card">
    <div class="ch"><h2 class="ct">הקבוצות שלי</h2><span class="badge">${S.groups.length}</span></div>
    ${S.groups.length?`<div>${S.groups.map(g=>`<div class="src" style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="src-ic" style="background:var(--coral-s)">${svg(I.groups,20,'#df3a0e')}</div><div style="flex:1;min-width:0"><b>${esc(g.n)}</b><div class="cs">חבר אחד · קוד <bdi dir="ltr">${g.c}</bdi></div></div><span class="badge teal">מנהל/ת</span></div>`).join('')}</div>`:empty(I.groups,'עוד לא הצטרפת לקבוצה')}
  </section>
  <section class="card">
    <h2 class="ct" style="margin-bottom:12px">יצירת קבוצה חדשה</h2>
    <div class="fg"><label class="lbl" for="new-g">שם הקבוצה</label><input id="new-g" class="in" style="width:100%" placeholder="למשל: רצי הבוקר" /></div>
    <button class="btn bp bblk" onclick="createG()">צור קבוצה</button>
  </section>`;
}
function joinG(){const v=document.getElementById('g-code').value.trim();toast(v?'לא נמצאה קבוצה עם הקוד הזה':'צריך להזין קוד')}
function createG(){const n=document.getElementById('new-g').value.trim();if(!n)return toast('צריך שם לקבוצה');const c=Math.random().toString(36).slice(2,8).toUpperCase();S.groups.push({n,c});toast('הקבוצה נוצרה');render()}

function me(){
  const o=(v,t,d)=>`<label class="opt ${S.privacy===v?'on':''}"><input type="radio" name="pv" ${S.privacy===v?'checked':''} onchange="S.privacy='${v}';render();toast('הפרטיות עודכנה')"/><div><b>${t}</b><span>${d}</span></div></label>`;
  return `
  <section class="card">
    <div class="me-top"><div class="av">${svg(I.me,24,'#fff')}</div><div style="min-width:0;flex:1"><h1 class="ct" style="font-size:1.22rem">${esc(S.user?.name||'החשבון שלי')}</h1><p class="cs" style="overflow-wrap:anywhere" dir="ltr">${esc(S.user?.email||'')}</p><div style="margin-top:6px"><span class="badge teal">אימייל אישי ייחודי</span></div></div></div>
  </section>
  <section class="card"><h2 class="ct" style="margin-bottom:12px">קיר השיאים שלי</h2>${prs()}</section>
  <section class="card">
    <h2 class="ct">פרטיות</h2><p class="cs" style="margin-bottom:12px">נאכף בשרת. תמיד אפשר להפוך ריצה בודדת לפרטית.</p>
    ${o('everyone','כולם','כל משתמש רשום יכול לראות ריצות משותפות')}
    ${o('friends','רק חברים','רק חברים מאושרים')}
    ${o('none','אף אחד','הפרופיל והריצות מוסתרים')}
    <label class="chk"><input type="checkbox" ${S.globalLb?'checked':''} onchange="S.globalLb=this.checked;toast('נשמר')"/>להופיע בדירוג הכללי (תוצאה אחת בלבד לכל רץ)</label>
  </section>
  <section class="card list" style="padding-top:6px;padding-bottom:6px">
    <button onclick="go('track')"><span>מדידת ריצה חיה (GPS)</span>${chev}</button>
    <button onclick="go('calc')"><span>מחשבון קצב וזמני מירוץ</span>${chev}</button>
    <button onclick="go('sources')"><span>מקורות מדידה (Garmin / Strava)</span>${chev}</button>
    <button onclick="go('resources')"><span>משאבים לרצים</span>${chev}</button>
    <button onclick="toast('טיוטת מדיניות פרטיות, גיל 18+')"><span>מדיניות פרטיות</span>${chev}</button>
    <button id="pv-logout-btn" onclick="logoutPreview()" style="color:var(--red-t)"><span>התנתקות מהחשבון</span>${chev}</button>
  </section>`;
}

function sources(){
  return `
  <h1 class="pt">מקורות מדידה</h1>
  <section class="card hero">
    <div class="ch"><div><h2 class="ct">מדידת GPS ישירה ב-Isrunner</h2><p class="cs">פעיל עכשיו ישירות מהטלפון</p></div><span class="badge teal">פעיל</span></div>
    <p style="margin:0 0 12px;font-size:.86rem;color:rgba(255,255,255,.78)">מודד מרחק, זמן נטו, קצב חי, קצב יעד (Pacer), פיצולי ק"מ ומפת מסלול ישירות מ-GPS הטלפון.</p>
    <button class="btn bp" onclick="go('track')">▶ התחל מדידת ריצה (GPS)</button>
  </section>
  <section class="card">
    <div class="src" style="margin-bottom:12px">
      <div class="src-ic" style="background:var(--coral-s)">${svg('<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',20,'#df3a0e')}</div>
      <div style="flex:1;min-width:0"><h2 class="ct">Strava</h2><p class="cs">OAuth 2.0 + סנכרון ריצות (כולל משעון Garmin)</p></div>
      <span class="badge amb">דורש שרת</span>
    </div>
    <ol class="steps">
      <li><span>חיבור OAuth אמיתי דורש את שרת Cloudflare (<code>worker.js</code>) — לא דף סטטי</span></li>
      <li><span>פותחים מפתח חינמי ב־<bdi dir="ltr">strava.com/settings/api</bdi> (2 דקות)</span></li>
      <li><span>מגדירים <code>STRAVA_CLIENT_ID</code> ו־<code>STRAVA_CLIENT_SECRET</code> ב־Cloudflare</span></li>
    </ol>
  </section>
  <section class="card">
    <div class="src" style="margin-bottom:12px">
      <div class="src-ic">${svg('<circle cx="12" cy="12" r="7"/><path d="M12 9v3l2 1"/><path d="M9 2h6M9 22h6"/>',22,'#0b7a62')}</div>
      <div style="flex:1;min-width:0"><h2 class="ct">Garmin Connect</h2><p class="cs">OAuth 2.0 PKCE + Push Webhook ישיר</p></div>
      <span class="badge amb">לא מחובר</span>
    </div>
    <ol class="steps">
      <li><span>הקוד מוכן בשרת (<code>worker.js</code>), דורש אישור בתוכנית המפתחים של Garmin</span></li>
      <li><span>אחרי אישור מגדירים <code>GARMIN_CLIENT_ID</code> ו־<code>GARMIN_CLIENT_SECRET</code></span></li>
      <li><span>ריצות משעון Garmin ייקלטו אוטומטית בלי הקלדה ידנית</span></li>
    </ol>
  </section>`;
}

function resources(){
  const r=(k,t,d)=>`<div class="res"><div class="k">${k}</div><div><b>${t}</b><span>${d}</span></div></div>`;
  return `<h1 class="pt">משאבים לרצים</h1><section class="card">${r('01','חימום לפני ריצה','5–8 דקות הליכה מהירה ותרגילי תנועה')}${r('02','שחרור אחרי ריצה','הליכה רגועה ומתיחות קלות')}${r('03','פודקאסטים','האזנה לריצות ארוכות')}${r('04','סרטוני טכניקה','יציבה, קדנס ונשימה')}</section>`;
}

function render(){
  if(!S.user)S.route='auth';
  const V={auth,home,track,calc,leaderboard,friends,groups,me,sources,resources};
  document.getElementById('main').innerHTML=(V[S.route]||auth)();
  const loggedIn=Boolean(S.user);
  document.getElementById('back-btn').classList.toggle('hidden',!loggedIn||!S.prev);
  document.getElementById('hdr-run-btn')?.classList.toggle('hidden',!loggedIn||S.route==='track'||Boolean(S.prev));
  const hu=document.getElementById('hdr-user');
  if(hu){
    hu.classList.toggle('hidden',!loggedIn);
    if(loggedIn)hu.innerHTML=`<i></i><span>${esc(S.user.name)}</span>`;
  }
  const bn=document.getElementById('bottom-nav');
  bn.classList.toggle('hidden',!loggedIn);
  if(loggedIn){
    const active=TABS.some(t=>t[0]===S.route)?S.route:(S.route==='track'||S.route==='calc'?'home':(S.prev||'me'));
    bn.innerHTML=TABS.map(([k,l])=>`<button class="nb ${k===active?'on':''}" data-tab="${k}" onclick="go('${k}')">${svg(I[k],21)}<span>${l}</span></button>`).join('');
  }
}
function setGoal(){const v=prompt('יעד שבועי בק"מ (ריק = בלי יעד)',S.goal||'');if(v===null)return;const n=parseFloat(v);S.goal=n>0?Math.round(n*10)/10:null;render();toast(S.goal?'היעד נשמר':'היעד הוסר')}
document.getElementById('back-btn').onclick=()=>go(S.prev||'home');
document.getElementById('brand-btn').onclick=()=>go(S.user?'home':'auth');
render();
</script>
</body>
</html>
